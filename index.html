<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272023"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>唱片机 · Record Room</title><link rel="icon" href="assets/icon-256.png"><link rel="apple-touch-icon" href="assets/icon-256.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="player.css"><script defer src="vendor/jsmediatags-3.9.7.min.js"></script><script defer src="player.js"></script></head>
<body>
<main><section id="deck" aria-label="唱机"><div class="seam"></div><button class="sleeve" id="sleeve" aria-label="打开此专辑"><img id="jacket" alt=""></button>
<div class="record"><div class="disc"><img id="label" alt=""><i class="spindle"></i></div></div><img class="arm" src="assets/tonearm-graphite-v1.png" alt=""></section>
<section class="controls" aria-label="播放控制"><div class="now"><h1 id="title">唱片机</h1><button id="tools" aria-label="打开播放工具">⋯</button></div>
<button id="artist" class="artist">选择歌曲</button><div class="timeline"><time id="elapsed">0:00</time><input id="seek" type="range" min="0" max="100" step="0.1" aria-label="播放进度"><time id="duration">0:00</time></div>
<div class="transport"><button id="play" aria-label="播放"><i></i><span>PLAY</span></button><button id="prev" aria-label="上一首"><i></i><span>◀❘</span></button><button id="next" aria-label="下一首"><i></i><span>❘▶</span></button></div>
<p id="message" role="status"></p></section></main>
<dialog id="sheet"><div class="sheet-top"><h2 id="heading">播放工具</h2><button id="close" aria-label="关闭">×</button></div><div id="content"></div></dialog>
<input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.aiff,.aif,.ogg,.opus,.caf,.alac" multiple hidden>
<audio id="audio" preload="metadata" playsinline></audio>
</body></html>
